name: bimo-modern
services:
  postgres:
    image: postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: bimo_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Local development password required}
      POSTGRES_DB: bimo_modern_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - modern_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bimo_dev -d bimo_modern_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  modern_postgres:
